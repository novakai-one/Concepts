<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concepts</title>
<meta name="description" content="Games for learning maths by moving things.">
<meta name="theme-color" content="#04050b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304050b'/%3E%3Cpath d='M6 26 L6 10' stroke='%23ff5c6c' stroke-width='3'/%3E%3Cpath d='M6 26 L22 26' stroke='%233ddc84' stroke-width='3'/%3E%3Cpath d='M6 26 L22 10' stroke='%23ffd166' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg: #04050b; --card: #0a1224; --line: #1c2a44; --ink: #e8eefc; --muted: #8a98b8; --accent: #59e1ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: 0.02em; }
  p { margin: 0; color: var(--muted); }
  .games { display: grid; gap: 14px; margin-top: 36px; }
  a.game { display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); outline: none; }
  .name { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  .topic { color: var(--accent); font-size: 14px; margin-top: 2px; }
  .what { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Concepts</h1>
  <p>Games for learning maths by moving things.</p>
  <div class="games">
    <a class="game" href="singular/">
      <div class="name">SINGULAR</div>
      <div class="topic">Linear algebra</div>
      <p class="what">Vectors, matrices, eigenvalues and more. Move space yourself and see what each idea does.</p>
    </a>
  </div>
</main>
</body>
</html>
